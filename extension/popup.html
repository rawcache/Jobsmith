<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/32.png" alt=""><strong>Jobsmith</strong><span id="dot" class="dot"></span></header>
  <main>
    <p id="status" class="muted">Checking for Jobsmith on this computer…</p>

    <section id="actions" hidden>
      <button id="fill" class="primary">Fill this application</button>
      <p class="hint">Fills it from your profile. It won't submit. Shortcut: Alt+J</p>

      <button id="save">Send this job to Jobsmith</button>
      <label class="row"><input type="checkbox" id="apply"> and apply with autopilot</label>
      <p id="result" class="result" hidden></p>
    </section>

    <section id="offline" hidden>
      <p>Jobsmith isn't running. Open a terminal and run:</p>
      <pre>jobsmith</pre>
      <p class="hint">Not installed yet? See <a href="https://github.com/rawcache/Jobsmith" target="_blank">github.com/rawcache/Jobsmith</a>.</p>
    </section>
  </main>
  <footer><a href="#" id="dash">Open the dashboard</a></footer>
  <script src="popup.js"></script>
</body>
</html>
