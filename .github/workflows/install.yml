# Runs the real one-line installers on every kind of computer we say Jobsmith installs on, and fails if any
# package is built from source (a new user's computer may have no compiler, Rust or OpenSSL headers).
# On a push or pull request it installs the wheel of the commit being tested (JOBSMITH_WHEEL); when a release is
# published, or on demand, it installs exactly what a new user gets: the latest release.
name: install
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  wheel:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build --wheel -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: wheel, path: dist/*.whl }
  install:
    needs: wheel
    if: ${{ !cancelled() && needs.wheel.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: Intel Macs, which lack wheels for some packages' newest versions (cryptography 50)
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      JOBSMITH_INSTALL_LOG: ${{ github.workspace }}/install.log    # kept for the checks below and on failure
      JOBSMITH_GITHUB_TOKEN: ${{ github.token }}    # shared runners hit GitHub's anonymous rate limit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (the installers themselves; nothing else from the checkout is used)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: needs.wheel.result == 'success'
        with: { name: wheel, path: dist }
      - name: Run install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "$(uname -sm), uv before: $(command -v uv || echo none)"
          if [ -d dist ]; then export JOBSMITH_WHEEL="$(ls "$PWD"/dist/*.whl)"; fi
          sh install.sh
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "$env:PROCESSOR_ARCHITECTURE, uv before: $((Get-Command uv -ErrorAction SilentlyContinue).Source)"
          if (Test-Path dist) { $env:JOBSMITH_WHEEL = (Get-ChildItem dist\*.whl).FullName }
          .\install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Nothing was built from source
        shell: bash
        run: |
          cat install.log
          if grep -Eq '^ *(Built|Building) ' install.log; then echo "::error::A package was built from source"; exit 1; fi
      - name: The compiled parts load
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          unix() { if command -v cygpath > /dev/null; then cygpath -u "$1"; else echo "$1"; fi; }   # Git Bash on Windows
          export PATH="$(unix "$(uv tool dir --bin)"):$PATH"
          tool="$(unix "$(uv tool dir)")/jobsmith"
          py="$tool/bin/python"; [ -x "$py" ] || py="$tool/Scripts/python.exe"
          "$py" -c "
          import platform, sys
          import cryptography, cryptography.hazmat.bindings._rust, greenlet, pydantic_core, PIL._imaging, psutil, playwright
          import jobsmith, jobsmith.cli
          print(platform.system(), platform.machine(), sys.version.split()[0], 'jobsmith', jobsmith.__version__, 'cryptography', cryptography.__version__)
          "
          jobsmith --help > /dev/null
      - name: The practice copy starts
        # The gate is reaching the practice copy, not just installing: start it, wait for it to answer, stop it.
        # Run outside the checkout, so `python -m jobsmith` imports the installed package, not ./jobsmith.
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          unix() { if command -v cygpath > /dev/null; then cygpath -u "$1"; else echo "$1"; fi; }
          export PATH="$(unix "$(uv tool dir --bin)"):$PATH"
          start=$(date +%s)
          jobsmith demo --no-open
          for i in $(seq 60); do curl -fs http://127.0.0.1:8766/api/ext/ping > ping.json && break; sleep 1; done
          cat ping.json; echo
          grep -q '"resume":"Alex_Rivera_resume.pdf"' ping.json || { echo "::error::The practice copy didn't answer"; exit 1; }
          echo "The practice copy answered $(( $(date +%s) - start )) s after jobsmith demo"
          jobsmith demo stop
          if curl -fs http://127.0.0.1:8766/api/ext/ping > /dev/null; then echo "::error::jobsmith demo stop left it running"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with: { name: "install-log-${{ matrix.os }}", path: install.log, if-no-files-found: ignore }
