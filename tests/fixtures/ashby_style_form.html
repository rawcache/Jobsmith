<!doctype html>
<!-- Hand-written form modeled on Ashby's (jobs.ashbyhq.com) single-page layout. NOT a saved copy of a
     real form: field ids and plain <select>s are simplified, and real Ashby uses generated ids and custom
     dropdowns. Used by tests/test_fill.py to show the generic filler (jobsmith/fill/generic.py) fills an
     Ashby-style form and stops before Submit. A sanitized real capture is a Phase 1 task. -->
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Software Engineer Intern</title></head>
<body>
  <main class="ashby-job-posting-right-pane">
    <h1>Software Engineer Intern</h1>
    <form class="ashby-application-form">

      <div class="ashby-application-form-field-entry">
        <label for="_systemfield_name">Name<span aria-hidden="true">*</span></label>
        <input id="_systemfield_name" name="_systemfield_name" type="text" required>
      </div>

      <div class="ashby-application-form-field-entry">
        <label for="_systemfield_email">Email<span aria-hidden="true">*</span></label>
        <input id="_systemfield_email" name="_systemfield_email" type="email" required>
      </div>

      <div class="ashby-application-form-field-entry">
        <label for="_systemfield_resume">Resume<span aria-hidden="true">*</span></label>
        <input id="_systemfield_resume" name="_systemfield_resume" type="file" required>
      </div>

      <div class="ashby-application-form-field-entry">
        <label for="field-linkedin">LinkedIn Profile</label>
        <input id="field-linkedin" name="field-linkedin" type="url">
      </div>

      <div class="ashby-application-form-field-entry">
        <label for="field-github">GitHub Profile</label>
        <input id="field-github" name="field-github" type="url">
      </div>

      <div class="ashby-application-form-field-entry">
        <label for="field-why">Why do you want to work here?<span aria-hidden="true">*</span></label>
        <textarea id="field-why" name="field-why" required></textarea>
      </div>

      <div class="ashby-application-form-field-entry">
        <label for="field-heard">How did you hear about us?</label>
        <select id="field-heard" name="field-heard">
          <option value="">Select...</option>
          <option>LinkedIn</option>
          <option>A friend</option>
          <option>University career fair</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Sponsorship: Jobsmith leaves this for the user (confirmed profile only), so the test
           does not hand the filler an answer for it. It must stay on its default. -->
      <div class="ashby-application-form-field-entry">
        <label for="field-sponsorship">Will you now or in the future require visa sponsorship?<span aria-hidden="true">*</span></label>
        <select id="field-sponsorship" name="field-sponsorship" required>
          <option value="">Select...</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <button type="submit" id="btn-submit">Submit Application</button>
    </form>
  </main>
  <script>
  window.submitClicks = 0;
  window.submitEvents = 0;
  document.querySelector('#btn-submit').addEventListener('click', () => { window.submitClicks++; });
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    window.submitEvents++;
    document.body.insertAdjacentHTML('beforeend', '<p>Thank you for applying!</p>');
  });
  </script>
</body>
</html>
