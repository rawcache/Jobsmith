<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Demo Lever application</title>
<!-- Sanitized public Lever /apply form captured 2026-10-21.
     Employer branding, account/user IDs, hidden metadata, scripts, and remote
     assets removed. Card IDs replaced; labels, controls, and nesting retained.
     No applicant data was present. Submission instrumentation is local only. -->
<style>.application-question { margin-bottom: 12px; } .application-label { display: block; }</style>
</head><body>
<form enctype="multipart/form-data" id="application-form" method="POST">
 <div class="section page-centered application-form">
  <h4>
   Submit your application
  </h4>
  <ul>
   <li class="application-question resume">
    <label>
     <div class="application-label">
      Resume/CV
     </div>
     <div class="application-field">
      <a class="postings-btn template-btn-utility visible-resume-upload" href="#">
       <span class="filename">
       </span>
       <span class="default-label">
        ATTACH RESUME/CV
       </span>
       <input class="application-file-input invisible-resume-upload" data-qa="input-resume" id="resume-upload-input" name="resume" tabindex="-1" type="file"/>
      </a>
     </div>
    </label>
   </li>
   <li class="application-question">
    <label>
     <div class="application-label">
      Full name
      <span class="required">
       ✱
      </span>
     </div>
     <div class="application-field">
      <input data-qa="name-input" name="name" required="" type="text"/>
     </div>
    </label>
   </li>
   <li class="application-question">
    <label>
     <div class="application-label">
      Email
      <span class="required">
       ✱
      </span>
     </div>
     <div class="application-field">
      <input data-qa="email-input" name="email" pattern="[a-zA-Z0-9.#$%&amp;'*+\/=?^_`{|}~][a-zA-Z0-9.!#$%&amp;'*+\/=?^_`{|}~-]*@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*" required="" type="email"/>
     </div>
    </label>
   </li>
   <li class="application-question">
    <label>
     <div class="application-label">
      Phone
      <span class="required">
       ✱
      </span>
     </div>
     <div class="application-field">
      <input data-qa="phone-input" name="phone" required="" type="text"/>
     </div>
    </label>
   </li>
   <li class="application-question" data-qa="structured-contact-location-question">
    <label>
     <div class="application-label">
      Current location
      <span class="required" data-qa="SCL-question-required-asterisk">
       ✱
      </span>
     </div>
     <div class="application-field">
      <input class="location-input" data-qa="location-input" id="location-input" maxlength="100" name="location" required="" type="text"/>
     </div>
    </label>
   </li>
   <li class="application-question">
    <label>
     <div class="application-label">
      Current company
     </div>
     <div class="application-field">
      <input data-qa="org-input" name="org" type="text"/>
     </div>
    </label>
   </li>
  </ul>
 </div>
 <div class="section page-centered application-form">
  <h4>
   Links
  </h4>
  <ul>
   <li class="application-question">
    <label>
     <div class="application-label">
      LinkedIn URL
      <span class="required">
       ✱
      </span>
     </div>
     <div class="application-field">
      <input name="urls[LinkedIn]" required="" type="text"/>
     </div>
    </label>
   </li>
   <li class="application-question">
    <label>
     <div class="application-label">
      GitHub URL
     </div>
     <div class="application-field">
      <input name="urls[GitHub]" type="text"/>
     </div>
    </label>
   </li>
   <li class="application-question">
    <label>
     <div class="application-label">
      Other website
     </div>
     <div class="application-field">
      <input name="urls[Other]" type="text"/>
     </div>
    </label>
   </li>
  </ul>
 </div>
 <div class="section page-centered application-form" data-qa="additional-cards">
  <h4 data-qa="card-name">
   Salary expectations
  </h4>
  <ul>
   <li class="application-question custom-question">
    <div>
     <div class="application-label full-width text">
      <div class="text">
       Do you have a salary expectation in mind? Please provide the monthly and net values (usd).
       <span class="required">
        ✱
       </span>
      </div>
     </div>
     <div class="application-field full-width required-field">
      <input class="card-field-input" name="cards[demo-question-1][field0]" placeholder="Type your response" required="required" type="text" value=""/>
     </div>
    </div>
   </li>
  </ul>
 </div>
 <div class="section page-centered application-form" data-qa="additional-cards">
  <h4 data-qa="card-name">
   English level
  </h4>
  <ul>
   <li class="application-question custom-question">
    <div>
     <div class="application-label full-width multiple-choice">
      <div class="text">
       What's your English level?
       <span class="required">
        ✱
       </span>
      </div>
     </div>
     <div class="application-field full-width required-field">
      <ul data-qa="multiple-choice">
       <li>
        <label>
         <input name="cards[demo-question-2][field0]" required="required" type="radio" value="A1-A2: Elementary / Beginner"/>
         <span class="application-answer-alternative">
          A1-A2: Elementary / Beginner
         </span>
        </label>
       </li>
       <li>
        <label>
         <input name="cards[demo-question-2][field0]" required="required" type="radio" value="B1-B2: Intermediate / Upper-Intermediate"/>
         <span class="application-answer-alternative">
          B1-B2: Intermediate / Upper-Intermediate
         </span>
        </label>
       </li>
       <li>
        <label>
         <input name="cards[demo-question-2][field0]" required="required" type="radio" value="C1: Advanced"/>
         <span class="application-answer-alternative">
          C1: Advanced
         </span>
        </label>
       </li>
       <li>
        <label>
         <input name="cards[demo-question-2][field0]" required="required" type="radio" value="C2: Proficiency / Native"/>
         <span class="application-answer-alternative">
          C2: Proficiency / Native
         </span>
        </label>
       </li>
      </ul>
     </div>
    </div>
   </li>
  </ul>
 </div>
 <div class="section page-centered application-form" data-qa="additional-cards">
  <h4 data-qa="card-name">
   Motivation
  </h4>
  <ul>
   <li class="application-question custom-question">
    <div>
     <div class="application-label full-width textarea">
      <div class="text">
       What motivates you to apply for this job?
      </div>
     </div>
     <div class="application-field full-width">
      <textarea class="card-field-input" name="cards[demo-question-3][field0]"></textarea>
     </div>
    </div>
   </li>
  </ul>
 </div>
 <div class="section page-centered application-form last-section-apply">
  <button class="postings-btn template-btn-submit cerulean" data-qa="btn-submit" href="#" id="btn-submit" type="button">
   Submit application
  </button>
 </div>
</form>

<script>
window.submitClicks = 0;
window.submitEvents = 0;
document.querySelector('#btn-submit').addEventListener('click', () => { window.submitClicks++; });
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  window.submitEvents++;
});
</script>
</body></html>
