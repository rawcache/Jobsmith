[project]
name = "jobsmith"
version = "0.4.6"
description = "Applies to jobs and internships for you, from your real resume, and never makes anything up."
readme = "README.md"
requires-python = ">=3.11,<3.14"   # 3.14: native deps (uvloop, greenlet) not yet reliable
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "playwright>=1.47",
  "pypdf>=4.3",
  "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12",
  "rich>=15.0.0",
  "fpdf2>=2.7",
  "psutil>=5.9",
  "textual>=0.80",
  "mcp>=1.2",
  "tzdata; sys_platform == 'win32'",   # zoneinfo has no time-zone database on Windows
]

[project.optional-dependencies]
api = []

[project.scripts]
jobsmith = "jobsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobsmith"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "jobsmith/extension"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
